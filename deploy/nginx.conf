# Bloco do nginx para expor o serviço de log num VPS comum.
#
# ⚠️ Desnecessário no Coolify: lá o proxy reverso e o certificado são da própria
# plataforma (basta informar o domínio e a porta 8787 na aplicação). Este arquivo
# serve para quando o serviço roda fora do Coolify.
#
# Copie para /etc/nginx/sites-available/routeid-native-log e ative com:
#   ln -s /etc/nginx/sites-available/routeid-native-log /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
#
# O TLS é obrigatório na prática: o app envia o token no cabeçalho e, sem https,
# ele trafega em claro. O certificado pode vir do certbot:
#   certbot --nginx -d logs.seudominio.com

server {
    listen 80;
    server_name logs.seudominio.com;
    # Redireciona tudo para https.
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name logs.seudominio.com;

    ssl_certificate     /etc/letsencrypt/live/logs.seudominio.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/logs.seudominio.com/privkey.pem;

    # O log de diagnóstico não é conteúdo público.
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Referrer-Policy "no-referrer" always;

    # O corpo do lote é pequeno (alguns KiB). O teto aqui é a segunda barreira
    # depois do limite do próprio serviço.
    client_max_body_size 1m;

    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # Se quiser trancar a ingestão na rede da operação, descomente e ajuste:
    # location = /api/logs {
    #     allow 200.0.0.0/8;
    #     deny all;
    #     proxy_pass http://127.0.0.1:8787;
    # }
}
